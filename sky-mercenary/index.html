<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Sky Contract — HD Shmup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/game.css" />
</head>
<body>
  <div id="app">
    <canvas id="game" width="1280" height="720" aria-label="Sky Contract"></canvas>
    <div id="ui" class="hidden">
      <div id="hud">
        <div class="hud-block">
          <span class="label">PILOTO</span>
          <span id="hud-plane">—</span>
        </div>
        <div class="hud-block">
          <span class="label">CRÉDITO</span>
          <span id="hud-money">$0</span>
        </div>
        <div class="hud-block">
          <span class="label">PUNTOS</span>
          <span id="hud-score">0</span>
        </div>
        <div class="hud-block hp-block">
          <span class="label">BLINDAJE</span>
          <div id="hp-bar"><div id="hp-fill"></div></div>
        </div>
      </div>
      <p id="hint">WASD / flechas mover · Espacio disparar · Shift especial</p>
    </div>
  </div>
  <!-- Scripts clásicos (sin ES modules) para poder abrir index.html con file:// -->
  <script src="js/planes.js"></script>
  <script src="js/draw.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
